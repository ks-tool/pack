apiVersion: horchestra.io/v1
kind: Secret
metadata:
  labels:
    horchestra.io/component: zookeeper
    horchestra.io/installation: prod
  name: prod-zookeeper-conf
  namespace: data
stringData:
  zoo.cfg: |
    clientPort=2181
    dataDir=/var/lib/zookeeper
    initLimit=10
    server.1=prod-zookeeper-0.prod-zookeeper.data:2888:3888
    server.2=prod-zookeeper-1.prod-zookeeper.data:2888:3888
    server.3=prod-zookeeper-2.prod-zookeeper.data:2888:3888
    syncLimit=5
    tickTime=2000
type: horchestra.io/config
