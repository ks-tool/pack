syntax = "proto3";

// Provider is the seam between pack and a target — Kubernetes, VMs, horchestra.
// pack knows no target: it renders a pack to a target-neutral Release, plans
// the saga and drives it step by step; a provider, a program of its own, says
// what a key's platform means on its system and turns each request of pack
// into the system's own data and actions — a StatefulSet and a Secret applied
// to a cluster, config files copied to a host and an image started there.
//
// pack starts the provider — a binary (pack-provider-<target>), or a
// container image run with podman or docker for a provider whose language's
// runtime the machine lacks — and tells it in its environment where to
// listen and the token to demand:
//
//   PACK_PROVIDER_ADDRESS  unix:///<path> (a binary: a socket in a private
//                          directory) or tcp://<host>:<port> (an image: the
//                          port is published on 127.0.0.1 only)
//   PACK_PROVIDER_TOKEN    every call carries it as the metadata
//                          pack-provider-token; refuse a call without it
//
// EOF on the provider's stdin is its signal to exit. The method set is
// closed and carries data only.
//
// Free-form documents — a key's platform subtree, the computed values of
// the report — travel as JSON, not as
// google.protobuf.Struct: Struct makes every number a double, and a formula's
// integer division must stay integer.
package pack.provider.v1;

option go_package = "github.com/ks-tool/pack/provider/providerpb;providerpb";

service Provider {
  // Handshake is the first call: the protocol the provider speaks and the
  // target it is. pack refuses a protocol it does not know.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  // Configure binds the provider to one installation; every call after it
  // is about that installation. A setting the target does not take is an
  // InvalidArgument.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // Resolve says what a selected key's platform means on the target.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // ValidatePlatform checks a key's platform in the target's own terms.
  rpc ValidatePlatform(ValidatePlatformRequest) returns (ValidatePlatformResponse);
  // Convert turns a release into the target's objects, as files — what the
  // target would apply, for pack template.
  rpc Convert(ConvertRequest) returns (ConvertResponse);

  // ReadInstalled returns the installation's record as pack last wrote it,
  // kept in the target's own system. Requires the "execute" capability.
  rpc ReadInstalled(ReadInstalledRequest) returns (ReadInstalledResponse);
  // WriteInstalled keeps pack's record of the installation — what is
  // installed and how far a saga got. The provider stores it verbatim.
  rpc WriteInstalled(WriteInstalledRequest) returns (WriteInstalledResponse);
  // Execute performs one step of the saga on the target and reports as it
  // goes; the last event says whether the step succeeded.
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
}

message HandshakeRequest {
  string protocol = 1;
}

message HandshakeResponse {
  string protocol = 1;
  string target = 2;
  // capabilities the target has: "execute" — it performs saga steps and
  // keeps the installation's record (ReadInstalled, WriteInstalled, Execute).
  repeated string capabilities = 3;
}

message ConfigureRequest {
  string installation = 1;
  map<string, string> settings = 2;
}

message ConfigureResponse {
  // namespace is the scope the target installs into; empty where it has none.
  string namespace = 1;
  // platform_schema is the JSON Schema of a key's platform subtree, $id urn:pack:platform.
  bytes platform_schema = 2;
}

message ResolveRequest {
  string key = 1;
  // scale is the component's x-pack.scale: single or replicas.
  string scale = 2;
  bytes platform_json = 3;
}

message ResolveResponse {
  string service = 1;
  string address = 2;
  repeated Instance instances = 3;
  reserved 4; // limits_json: the pack reads limits off resources itself
  // platform_json is the target's half of the key's platform as it will run
  // it — replicas, placement … — what the operator wrote, what the
  // environment says, its defaults.
  bytes platform_json = 5;
}

message Instance {
  string name = 1;
  string address = 2;
}

message ValidatePlatformRequest {
  string key = 1;
  bytes platform_json = 2;
  reserved 3; // minimum: resources are the pack's, the pack checks it
}

message ValidatePlatformResponse {
  repeated string problems = 1;
}

message ConvertRequest {
  Release release = 1;
  repeated Credential credentials = 2;
}

message ConvertResponse {
  repeated File files = 1;
}

message File {
  string path = 1;
  bytes data = 2;
  uint32 mode = 3;
  // stream: part of what `pack template` prints without -o.
  bool stream = 4;
}

message Credential {
  string name = 1;
  string leaf = 2;
  string value = 3;
  string key = 4;
}

message ReadInstalledRequest {}

message ReadInstalledResponse {
  bool exists = 1;
  bytes record = 2;
}

message WriteInstalledRequest {
  bytes record = 1;
}

message WriteInstalledResponse {}

// ExecuteRequest is one step of the saga, with everything the provider needs
// to perform it: the key's unit in the version being installed, the unit of
// the installed version where there is one, and for a hook what to run.
message ExecuteRequest {
  Step step = 1;
  Unit unit = 2;
  Unit previous = 3;
  repeated Credential credentials = 4;
}

message Step {
  int64 n = 1;
  string key = 2;
  // kind: stop | hook | apply | wait | remove.
  string kind = 3;
  string name = 4;
  string phase = 5;
  string timeout = 6;
  bool exclusive = 7;
  string image = 8;
  repeated string command = 9;
  // rollback: this step undoes an earlier one — an apply of the previous
  // unit, a remove of a key that was added, a hook's compensation.
  bool rollback = 10;
}

message ExecuteEvent {
  string message = 1;
  bool done = 2;
  // error, on the last event: why the step failed; empty — it succeeded.
  string error = 3;
}

// ---- render.Release

message Release {
  string installation = 1;
  string pack = 2;
  string version = 3;
  Rollout rollout = 4;
  repeated Unit units = 5;
  Report report = 6;
}

message Rollout {
  int64 max_unavailable = 1;
}

message Unit {
  string key = 1;
  string component = 2;
  int64 replicas = 3;
  string image = 4;
  string restart_policy = 5;
  repeated string command = 6;
  repeated string args = 7;
  repeated EnvVar env = 8;
  repeated Port ports = 9;
  bool spread = 10;
  bytes platform_json = 11;
  Readiness readiness = 12;
  repeated Claim data = 13;
  repeated Library libraries = 14;
  repeated RenderedFile files = 15;
  repeated SecretFile secret_files = 16;
  // the pack's half of the platform, read: cgroups and metadata
  Resources resources = 17;
  map<string, string> labels = 18;
  map<string, string> annotations = 19;
}

message Resources {
  map<string, string> requests = 1;
  map<string, string> limits = 2;
}

message EnvVar {
  string name = 1;
  string value = 2;
  SecretRef secret = 3;
}

message SecretRef {
  string name = 1;
  string key = 2;
}

message Port {
  string name = 1;
  int64 port = 2;
}

message Readiness {
  TCPProbe tcp = 1;
  HTTPProbe http = 2;
  repeated string exec = 3;
}

message TCPProbe {
  int64 port = 1;
}

message HTTPProbe {
  int64 port = 1;
  string path = 2;
}

message Claim {
  string name = 1;
  string path = 2;
  string size = 3;
}

message Library {
  string name = 1;
  string path = 2;
  string image = 3;
}

message RenderedFile {
  string path = 1;
  optional uint32 mode = 2;
  bytes content = 3;
  bool per_instance = 4;
  // instances: one per replica, in order; present is false where the
  // replica's section was empty and the file does not exist for it.
  repeated InstanceBytes instances = 5;
  repeated string secrets = 6;
}

message InstanceBytes {
  bool present = 1;
  bytes data = 2;
}

message SecretFile {
  string path = 1;
  optional uint32 mode = 2;
  SecretRef secret = 3;
  bool per_instance = 4;
}

message Report {
  string installation = 1;
  string namespace = 2;
  string pack = 3;
  repeated string order = 4;
  map<string, Roles> peers = 5;
  bytes computed_json = 6;
  map<string, Names> secrets = 7;
}

message Roles {
  map<string, string> roles = 1;
}

message Names {
  repeated string names = 1;
}
