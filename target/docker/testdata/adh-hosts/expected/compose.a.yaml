name: prod
networks:
  default:
    name: prod
secrets:
  pack_secret_prod_kafka_tls_keystore_jks:
    environment: PACK_SECRET_PROD_KAFKA_TLS_KEYSTORE_JKS
services:
  hive-db:
    container_name: prod-hive-db
    cpu_shares: 2048
    environment:
      POSTGRES_PASSWORD: ${PACK_SECRET_PROD_HIVE_DB_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-hive-db 5432 || bash -c '</dev/tcp/prod-hive-db/5432'
      timeout: 3s
    hostname: prod-hive-db
    image: images/postgres:16.3
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "0"
      pack.horchestra.io/key: hive-db
      pack.horchestra.io/part: workload
    mem_limit: 4294967296
    mem_reservation: 4294967296
    ports:
    - 5432:5432
    restart: unless-stopped
    volumes:
    - source: data-prod-hive-db
      target: /var/lib/postgresql/data
      type: volume
    - read_only: true
      source: ./files/prod-hive-db/etc/postgresql/postgresql.conf
      target: /etc/postgresql/postgresql.conf
      type: bind
  kafka-0:
    command:
    - --override
    - min.insync.replicas=2
    container_name: prod-kafka-0
    cpu_shares: 8192
    environment:
      KAFKA_HEAP_OPTS: -Xmx24576m -Xms24576m -XX:+UseG1GC
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-kafka-0 9092 || bash -c '</dev/tcp/prod-kafka-0/9092'
      timeout: 3s
    hostname: prod-kafka-0
    image: images/kafka:3.7.1
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "0"
      pack.horchestra.io/key: kafka
      pack.horchestra.io/part: workload
    mem_limit: 34359738368
    mem_reservation: 34359738368
    ports:
    - 9092:9092
    - 9093:9093
    restart: unless-stopped
    secrets:
    - source: pack_secret_prod_kafka_tls_keystore_jks
      target: /opt/kafka/config/keystore.jks
    volumes:
    - source: data-prod-kafka-0
      target: /var/lib/kafka/data
      type: volume
    - read_only: true
      source: images/jdk:21.0.4
      target: /opt/java
      type: image
    - read_only: true
      source: ./files/prod-kafka-0/opt/kafka/config/kafka_jaas.conf
      target: /opt/kafka/config/kafka_jaas.conf
      type: bind
    - read_only: true
      source: ./files/prod-kafka-0/opt/kafka/config/server.properties
      target: /opt/kafka/config/server.properties
      type: bind
  zookeeper-0:
    container_name: prod-zookeeper-0
    cpu_shares: 512
    environment:
      JVMFLAGS: -Xmx768m -Xms768m -XX:+UseG1GC
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-zookeeper-0 2181 || bash -c '</dev/tcp/prod-zookeeper-0/2181'
      timeout: 3s
    hostname: prod-zookeeper-0
    image: images/zookeeper:3.9.2
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "0"
      pack.horchestra.io/key: zookeeper
      pack.horchestra.io/part: workload
    mem_limit: 1073741824
    mem_reservation: 1073741824
    ports:
    - 2181:2181
    - 3888:3888
    - 2888:2888
    restart: unless-stopped
    volumes:
    - source: data-prod-zookeeper-0
      target: /var/lib/zookeeper
      type: volume
    - read_only: true
      source: images/jdk:21.0.4
      target: /opt/java
      type: image
    - read_only: true
      source: ./files/prod-zookeeper-0/conf/zoo.cfg
      target: /conf/zoo.cfg
      type: bind
    - read_only: true
      source: ./files/prod-zookeeper-0/var/lib/zookeeper/myid
      target: /var/lib/zookeeper/myid
      type: bind
volumes:
  data-prod-hive-db:
    name: data-prod-hive-db
  data-prod-kafka-0:
    name: data-prod-kafka-0
  data-prod-zookeeper-0:
    name: data-prod-zookeeper-0
