name: prod
networks:
  default:
    name: prod
secrets:
  pack_secret_prod_kafka_tls_keystore_jks:
    environment: PACK_SECRET_PROD_KAFKA_TLS_KEYSTORE_JKS
services:
  kafka-2:
    command:
    - --override
    - min.insync.replicas=2
    container_name: prod-kafka-2
    cpu_shares: 8192
    environment:
      KAFKA_HEAP_OPTS: -Xmx24576m -Xms24576m -XX:+UseG1GC
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-kafka-2 9092 || bash -c '</dev/tcp/prod-kafka-2/9092'
      timeout: 3s
    hostname: prod-kafka-2
    image: images/kafka:3.7.1
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "2"
      pack.horchestra.io/key: kafka
      pack.horchestra.io/part: workload
    mem_limit: 34359738368
    mem_reservation: 34359738368
    ports:
    - 9092:9092
    - 9093:9093
    restart: unless-stopped
    secrets:
    - source: pack_secret_prod_kafka_tls_keystore_jks
      target: /opt/kafka/config/keystore.jks
    volumes:
    - source: data-prod-kafka-2
      target: /var/lib/kafka/data
      type: volume
    - read_only: true
      source: images/jdk:21.0.4
      target: /opt/java
      type: image
    - read_only: true
      source: ./files/prod-kafka-2/opt/kafka/config/kafka_jaas.conf
      target: /opt/kafka/config/kafka_jaas.conf
      type: bind
    - read_only: true
      source: ./files/prod-kafka-2/opt/kafka/config/server.properties
      target: /opt/kafka/config/server.properties
      type: bind
  zookeeper-2:
    container_name: prod-zookeeper-2
    cpu_shares: 512
    environment:
      JVMFLAGS: -Xmx768m -Xms768m -XX:+UseG1GC
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-zookeeper-2 2181 || bash -c '</dev/tcp/prod-zookeeper-2/2181'
      timeout: 3s
    hostname: prod-zookeeper-2
    image: images/zookeeper:3.9.2
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "2"
      pack.horchestra.io/key: zookeeper
      pack.horchestra.io/part: workload
    mem_limit: 1073741824
    mem_reservation: 1073741824
    ports:
    - 2181:2181
    - 3888:3888
    - 2888:2888
    restart: unless-stopped
    volumes:
    - source: data-prod-zookeeper-2
      target: /var/lib/zookeeper
      type: volume
    - read_only: true
      source: images/jdk:21.0.4
      target: /opt/java
      type: image
    - read_only: true
      source: ./files/prod-zookeeper-2/conf/zoo.cfg
      target: /conf/zoo.cfg
      type: bind
    - read_only: true
      source: ./files/prod-zookeeper-2/var/lib/zookeeper/myid
      target: /var/lib/zookeeper/myid
      type: bind
volumes:
  data-prod-kafka-2:
    name: data-prod-kafka-2
  data-prod-zookeeper-2:
    name: data-prod-zookeeper-2
