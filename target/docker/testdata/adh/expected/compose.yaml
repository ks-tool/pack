volumes:
  data-prod-hive-db:
    name: data-prod-hive-db
  data-prod-kafka-0:
    name: data-prod-kafka-0
  data-prod-kafka-1:
    name: data-prod-kafka-1
  data-prod-kafka-2:
    name: data-prod-kafka-2
  data-prod-ranger-db:
    name: data-prod-ranger-db
  data-prod-zookeeper-0:
    name: data-prod-zookeeper-0
  data-prod-zookeeper-1:
