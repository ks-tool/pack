name: prod
networks:
  default:
    name: prod
secrets:
  pack_secret_prod_kafka_tls_keystore_jks:
    environment: PACK_SECRET_PROD_KAFKA_TLS_KEYSTORE_JKS
services:
  hive-db:
    container_name: prod-hive-db
    cpu_shares: 2048
    domainname: prod
    environment:
      POSTGRES_PASSWORD: ${PACK_SECRET_PROD_HIVE_DB_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-hive-db 5432 || bash -c '</dev/tcp/prod-hive-db/5432'
      timeout: 3s
    hostname: prod-hive-db
    image: images/postgres:16.3
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "0"
      pack.horchestra.io/key: hive-db
      pack.horchestra.io/part: workload
    mem_limit: 4294967296
    mem_reservation: 4294967296
    restart: unless-stopped
    volumes:
    - source: data-prod-hive-db
      target: /var/lib/postgresql/data
      type: volume
    - read_only: true
      source: ./files/prod-hive-db/etc/postgresql/postgresql.conf
      target: /etc/postgresql/postgresql.conf
      type: bind
  kafka-0:
    command:
    - --override
    - min.insync.replicas=2
    container_name: prod-kafka-0
    cpu_shares: 8192
    domainname: prod
    environment:
      KAFKA_HEAP_OPTS: -Xmx24576m -Xms24576m -XX:+UseG1GC
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-kafka-0 9092 || bash -c '</dev/tcp/prod-kafka-0/9092'
      timeout: 3s
    hostname: prod-kafka-0
    image: images/kafka:3.7.1
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "0"
      pack.horchestra.io/key: kafka
      pack.horchestra.io/part: workload
    mem_limit: 34359738368
    mem_reservation: 34359738368
    networks:
      default:
        aliases:
        - prod-kafka
    restart: unless-stopped
    secrets:
    - source: pack_secret_prod_kafka_tls_keystore_jks
      target: /opt/kafka/config/keystore.jks
    volumes:
    - source: data-prod-kafka-0
      target: /var/lib/kafka/data
      type: volume
    - read_only: true
      source: images/jdk:21.0.4
      target: /opt/java
      type: image
    - read_only: true
      source: ./files/prod-kafka-0/opt/kafka/config/kafka_jaas.conf
      target: /opt/kafka/config/kafka_jaas.conf
      type: bind
    - read_only: true
      source: ./files/prod-kafka-0/opt/kafka/config/server.properties
      target: /opt/kafka/config/server.properties
      type: bind
  kafka-1:
    command:
    - --override
    - min.insync.replicas=2
    container_name: prod-kafka-1
    cpu_shares: 8192
    domainname: prod
    environment:
      KAFKA_HEAP_OPTS: -Xmx24576m -Xms24576m -XX:+UseG1GC
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-kafka-1 9092 || bash -c '</dev/tcp/prod-kafka-1/9092'
      timeout: 3s
    hostname: prod-kafka-1
    image: images/kafka:3.7.1
    labels:
      pack.horchestra.io/installation: prod
      pack.horchestra.io/instance: "1"
      pack.horchestra.io/key: kafka
      pack.horchestra.io/part: workload
    mem_limit: 34359738368
    mem_reservation: 34359738368
    networks:
      default:
        aliases:
        - prod-kafka
    restart: unless-stopped
    secrets:
    - source: pack_secret_prod_kafka_tls_keystore_jks
      target: /opt/kafka/config/keystore.jks
    volumes:
    - source: data-prod-kafka-1
      target: /var/lib/kafka/data
      type: volume
    - read_only: true
      source: images/jdk:21.0.4
      target: /opt/java
      type: image
    - read_only: true
      source: ./files/prod-kafka-1/opt/kafka/config/kafka_jaas.conf
      target: /opt/kafka/config/kafka_jaas.conf
      type: bind
    - read_only: true
      source: ./files/prod-kafka-1/opt/kafka/config/server.properties
      target: /opt/kafka/config/server.properties
      type: bind
  kafka-2:
