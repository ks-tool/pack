      type: bind
    - read_only: true
      source: ./files/prod-zookeeper-0/var/lib/zookeeper/myid
      target: /var/lib/zookeeper/myid
      type: bind
  zookeeper-1:
    container_name: prod-zookeeper-1
    cpu_shares: 512
    domainname: prod
