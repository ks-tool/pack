      target: /opt/kafka/config/server.properties
      type: bind
  ranger-db:
    container_name: prod-ranger-db
    cpu_shares: 512
    domainname: prod
    environment:
      POSTGRES_PASSWORD: ${PACK_SECRET_PROD_RANGER_DB_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - nc -z prod-ranger-db 5432 || bash -c '</dev/tcp/prod-ranger-db/5432'
      timeout: 3s
    hostname: prod-ranger-db
    image: images/postgres:16.3
    labels:
