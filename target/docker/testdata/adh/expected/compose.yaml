  zookeeper-2:
    configs:
    - source: zookeeper-2-0-zoo.cfg
      target: /conf/zoo.cfg
    - source: zookeeper-2-1-myid
      target: /var/lib/zookeeper/myid
    container_name: prod-zookeeper-2
    cpu_shares: 512
    environment:
      JVMFLAGS: -Xmx768m -Xms768m -XX:+UseG1GC
    healthcheck:
      interval: 5s
      retries: 3
