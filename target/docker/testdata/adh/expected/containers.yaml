- aliases:
  - prod-kafka
  command:
  - --override
  - min.insync.replicas=2
  env:
    KAFKA_HEAP_OPTS: -Xmx24576m -Xms24576m -XX:+UseG1GC
  healthcheck:
  - CMD-SHELL
  - nc -z prod-kafka-0 9092 || bash -c '</dev/tcp/prod-kafka-0/9092'
  image: images/kafka:3.7.1
  labels:
    pack.horchestra.io/installation: prod
    pack.horchestra.io/instance: "0"
    pack.horchestra.io/key: kafka
    pack.horchestra.io/part: workload
  mounts:
  - target: /var/lib/kafka/data
    volume: data-prod-kafka-0
  - image: images/jdk:21.0.4
    target: /opt/java
  - file: files/prod-kafka-0/opt/kafka/config/kafka_jaas.conf
    mode: "0400"
    target: /opt/kafka/config/kafka_jaas.conf
  - file: files/prod-kafka-0/opt/kafka/config/server.properties
    target: /opt/kafka/config/server.properties
  - mode: "0400"
    secret: prod-kafka-tls/keystore.jks
    target: /opt/kafka/config/keystore.jks
  name: prod-kafka-0
  network: prod
  resources:
    cpuShares: 8192
    memory: 34359738368
    memoryReservation: 34359738368
  restart: unless-stopped
