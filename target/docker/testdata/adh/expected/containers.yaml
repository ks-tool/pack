containers:
- aliases:
  - prod-zookeeper
  env:
    JVMFLAGS: -Xmx768m -Xms768m -XX:+UseG1GC
  healthcheck:
  - CMD-SHELL
  - nc -z prod-zookeeper-0 2181 || bash -c '</dev/tcp/prod-zookeeper-0/2181'
  image: images/zookeeper:3.9.2
  labels:
    pack.horchestra.io/installation: prod
    pack.horchestra.io/instance: "0"
    pack.horchestra.io/key: zookeeper
    pack.horchestra.io/part: workload
  mounts:
  - target: /var/lib/zookeeper
    volume: data-prod-zookeeper-0
  - image: images/jdk:21.0.4
    target: /opt/java
  - file: files/prod-zookeeper-0/conf/zoo.cfg
    target: /conf/zoo.cfg
  - file: files/prod-zookeeper-0/var/lib/zookeeper/myid
    target: /var/lib/zookeeper/myid
  name: prod-zookeeper-0
  network: prod
  resources:
    cpuShares: 512
    memory: 1073741824
    memoryReservation: 1073741824
  restart: unless-stopped
