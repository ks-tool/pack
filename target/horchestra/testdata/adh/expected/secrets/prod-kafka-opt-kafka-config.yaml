apiVersion: horchestra.io/v1
kind: Secret
metadata:
  labels:
    horchestra.io/component: kafka
    horchestra.io/installation: prod
  name: prod-kafka-opt-kafka-config
  namespace: data
stringData:
  kafka_jaas.conf: |
    KafkaServer {
      org.apache.kafka.common.security.scram.ScramLoginModule required
      username="kafka"
      password="${secret:prod-kafka-sasl/password}";
    };
  server.properties: |
    broker.id.generation.enable=true
    listeners=PLAINTEXT://:9092,INTERNAL://:9093
    log.dirs=/var/lib/kafka/data
    min.insync.replicas=2
    num.partitions=3
    zookeeper.connect=prod-zookeeper-0.prod-zookeeper.data:2181,prod-zookeeper-1.prod-zookeeper.data:2181,prod-zookeeper-2.prod-zookeeper.data:2181/prod
type: horchestra.io/config
