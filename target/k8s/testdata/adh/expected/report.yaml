computed:
  /hive-db/conf/shared_buffers: 1024MB
  /kafka/conf/listeners: PLAINTEXT://:9092,INTERNAL://:9093
  /kafka/conf/zookeeper.connect: prod-zookeeper-0.prod-zookeeper.data.svc:2181,prod-zookeeper-1.prod-zookeeper.data.svc:2181,prod-zookeeper-2.prod-zookeeper.data.svc:2181/prod
  /kafka/heapOpts: -Xmx24576m -Xms24576m -XX:+UseG1GC
  /kafka/jdk/heapMB: 24576
  /kafka/jdk/heapOpts: -Xmx24576m -Xms24576m -XX:+UseG1GC
  /ranger-db/conf/shared_buffers: 128MB
  /zookeeper/conf/server:
    "1": prod-zookeeper-0.prod-zookeeper.data.svc:2888:3888
    "2": prod-zookeeper-1.prod-zookeeper.data.svc:2888:3888
    "3": prod-zookeeper-2.prod-zookeeper.data.svc:2888:3888
  /zookeeper/heapOpts: -Xmx768m -Xms768m -XX:+UseG1GC
  /zookeeper/jdk/heapMB: 768
  /zookeeper/jdk/heapOpts: -Xmx768m -Xms768m -XX:+UseG1GC
installation: prod
namespace: data
order:
- zookeeper
- kafka
- ranger-db
- hive-db
pack: adh
peers:
  hive-db: {}
  kafka:
    zk: zookeeper
  ranger-db: {}
  zookeeper: {}
