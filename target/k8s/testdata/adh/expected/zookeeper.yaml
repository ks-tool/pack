apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: prod
    app.kubernetes.io/managed-by: pack
    app.kubernetes.io/name: zookeeper
    pack.horchestra.io/part: config
  name: prod-zookeeper-conf
  namespace: data
stringData:
  zoo.cfg: |
    clientPort=2181
    dataDir=/var/lib/zookeeper
    initLimit=10
    server.1=prod-zookeeper-0.prod-zookeeper.data.svc:2888:3888
    server.2=prod-zookeeper-1.prod-zookeeper.data.svc:2888:3888
    server.3=prod-zookeeper-2.prod-zookeeper.data.svc:2888:3888
    syncLimit=5
    tickTime=2000
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: prod
    app.kubernetes.io/managed-by: pack
    app.kubernetes.io/name: zookeeper
    pack.horchestra.io/part: config
  name: prod-zookeeper-var-lib-zookeeper
  namespace: data
stringData:
  myid.0: |
    1
  myid.1: |
    2
  myid.2: |
    3
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: prod
    app.kubernetes.io/managed-by: pack
    app.kubernetes.io/name: zookeeper
    pack.horchestra.io/part: workload
  name: prod-zookeeper
  namespace: data
spec:
  clusterIP: None
  ports:
  - name: client
    port: 2181
    targetPort: 2181
  - name: election
    port: 3888
    targetPort: 3888
  - name: peer
    port: 2888
    targetPort: 2888
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: prod
    app.kubernetes.io/managed-by: pack
    app.kubernetes.io/name: zookeeper
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: prod
    app.kubernetes.io/managed-by: pack
    app.kubernetes.io/name: zookeeper
    pack.horchestra.io/part: workload
  name: prod-zookeeper
  namespace: data
spec:
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: prod
      app.kubernetes.io/managed-by: pack
      app.kubernetes.io/name: zookeeper
  serviceName: prod-zookeeper
  template:
    metadata:
      annotations:
        pack.horchestra.io/config: 11a6e4f120ac5ef3
      labels:
        app.kubernetes.io/instance: prod
        app.kubernetes.io/managed-by: pack
        app.kubernetes.io/name: zookeeper
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: prod
                app.kubernetes.io/managed-by: pack
                app.kubernetes.io/name: zookeeper
            topologyKey: kubernetes.io/hostname
      containers:
      - env:
        - name: JVMFLAGS
          value: -Xmx768m -Xms768m -XX:+UseG1GC
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        image: images/zookeeper:3.9.2
        name: zookeeper
        ports:
        - containerPort: 2181
          name: client
        - containerPort: 3888
          name: election
        - containerPort: 2888
          name: peer
        readinessProbe:
          tcpSocket:
            port: 2181
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /var/lib/zookeeper
          name: data
        - mountPath: /opt/java
          name: lib-0
          readOnly: true
        - mountPath: /conf/zoo.cfg
          name: cfg-0
          readOnly: true
          subPath: zoo.cfg
        - mountPath: /var/lib/zookeeper/myid
          name: cfg-1
          readOnly: true
          subPathExpr: $(POD_NAME)/myid
      volumes:
      - image:
          pullPolicy: IfNotPresent
          reference: images/jdk:21.0.4
        name: lib-0
      - name: cfg-0
        secret:
          items:
          - key: zoo.cfg
            path: zoo.cfg
          secretName: prod-zookeeper-conf
      - name: cfg-1
        secret:
          items:
          - key: myid.0
            path: prod-zookeeper-0/myid
          - key: myid.1
            path: prod-zookeeper-1/myid
          - key: myid.2
            path: prod-zookeeper-2/myid
          secretName: prod-zookeeper-var-lib-zookeeper
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
